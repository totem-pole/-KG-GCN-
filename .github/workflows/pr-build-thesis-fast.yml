name: PR thesis PDF build fast

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile with full TeXLive container
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          os: debian
          latexmk_use_xelatex: true
          extra_system_packages: "librsvg2-bin fonts-noto-cjk"
          pre_compile: |
            python3 scripts/apply_final_figures.py
            sed -i 's/国家统计局，2026-06-04/国家统计局，2026-06-05/g' references/publication.bib
            while IFS= read -r -d '' f; do rsvg-convert -f pdf -o "${f%.svg}.pdf" "$f"; done < <(find figures -type f -name '*.svg' -print0)
            find sections -type f -name '*.tex' -print0 | xargs -0 sed -i 's/\.svg}/.pdf}/g'

      - name: Check unresolved references and citations
        shell: bash
        run: |
          if grep -E "There were undefined references|Citation .* undefined|Reference .* undefined|Warning--I didn't find a database entry" main.log; then
            echo "Unresolved references/citations detected."
            exit 1
          fi
          echo "No unresolved references/citations found."

      - name: Upload thesis artifact
        uses: actions/upload-artifact@v4
        with:
          name: thesis-final-fast
          path: |
            main.pdf
            main.log
          if-no-files-found: error
          retention-days: 30
