name: Build editable turbine Visio

on:
  push:
    branches: [ main ]
    paths:
      - 'visio/turbine_state_monitoring/**'
      - '.github/workflows/build-visio-turbine.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'visio/turbine_state_monitoring/**'
      - '.github/workflows/build-visio-turbine.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-visio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore visio/turbine_state_monitoring/TurbineVisio.csproj

      - name: Generate editable VSDX
        env:
          OUTPUT_DIR: visio/turbine_state_monitoring/out
        run: dotnet run --project visio/turbine_state_monitoring/TurbineVisio.csproj -c Release

      - name: List outputs
        run: find visio/turbine_state_monitoring/out -maxdepth 1 -type f -printf '%f\n'

      - name: Upload Visio artifact
        uses: actions/upload-artifact@v4
        with:
          name: turbine-visio-editable
          path: visio/turbine_state_monitoring/out/*
          if-no-files-found: error
          retention-days: 30
