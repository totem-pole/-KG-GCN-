name: Chapter2 Yang-style redraw v14

on:
  push:
    branches: [codex/ch2-ch4-experiment-archive-20260822]
    paths:
      - 'scripts/ch2_redraw_yang_v14.py'
      - '.github/workflows/ch2-redraw-v14.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  redraw:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout experiment branch with LFS
        uses: actions/checkout@v4
        with:
          ref: codex/ch2-ch4-experiment-archive-20260822
          fetch-depth: 1
          lfs: true

      - name: Verify LFS prediction payloads
        shell: bash
        run: |
          git lfs pull
          ls -lh experiments/chapter2_state_monitoring/vhp_final24/predictions/*.npz
          python - <<'PY'
          import numpy as np
          p='experiments/chapter2_state_monitoring/vhp_final24/predictions/month_expanded_2024_GRU-RNN.npz'
          z=np.load(p,allow_pickle=True)
          print('keys=',z.files)
          print('test_actual=',z['test_actual'].shape,'test_pred=',z['test_pred'].shape)
          PY

      - name: Install plotting dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas matplotlib
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Draw frozen-result figures
        run: python scripts/ch2_redraw_yang_v14.py

      - name: Upload redraw artifact
        uses: actions/upload-artifact@v4
        with:
          name: ch2-yang-v14
          path: artifacts/ch2_yang_v14/
          if-no-files-found: error
          retention-days: 30
