<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker><style>text{font-family:'Noto Serif CJK SC','SimSun','Songti SC',serif;fill:#111}.t{font-size:26px;font-weight:700}.s{font-size:15px}.xs{font-size:13px}.box{fill:#fff;stroke:#111;stroke-width:1.8}.thin{fill:none;stroke:#111;stroke-width:1.5}</style></defs><rect width="100%" height="100%" fill="white"/><text x="800" y="45" text-anchor="middle" class="t">汽轮机系统设备级状态监测建模框架</text><rect x="60" y="125" width="220" height="85" class="box"/><text x="170" y="156" text-anchor="middle" class="s">汽轮机系统</text><text x="170" y="180" text-anchor="middle" class="s">热力拓扑与DCS测点</text><line x1="280" y1="168" x2="360" y2="168" class="thin" marker-end="url(#arrow)"/><rect x="360" y="125" width="220" height="85" class="box"/><text x="470" y="156" text-anchor="middle" class="s">按设备物理边界</text><text x="470" y="180" text-anchor="middle" class="s">划分建模对象</text><line x1="470" y1="210" x2="470" y2="270" class="thin"/><line x1="125" y1="270" x2="1205" y2="270" class="thin"/><g class="s"><line x1="140" y1="270" x2="140" y2="310" class="thin"/><rect x="80" y="310" width="120" height="55" class="box"/><text x="140" y="343" text-anchor="middle">VHP</text><line x1="320" y1="270" x2="320" y2="310" class="thin"/><rect x="260" y="310" width="120" height="55" class="box"/><text x="320" y="343" text-anchor="middle">RH1</text><line x1="500" y1="270" x2="500" y2="310" class="thin"/><rect x="440" y="310" width="120" height="55" class="box"/><text x="500" y="343" text-anchor="middle">HP</text><line x1="680" y1="270" x2="680" y2="310" class="thin"/><rect x="620" y="310" width="120" height="55" class="box"/><text x="680" y="343" text-anchor="middle">RH2</text><line x1="860" y1="270" x2="860" y2="310" class="thin"/><rect x="800" y="310" width="120" height="55" class="box"/><text x="860" y="343" text-anchor="middle">IP</text><line x1="1040" y1="270" x2="1040" y2="310" class="thin"/><rect x="980" y="310" width="120" height="55" class="box"/><text x="1040" y="343" text-anchor="middle">LP</text><line x1="1220" y1="270" x2="1220" y2="310" class="thin"/><rect x="1160" y="310" width="120" height="55" class="box"/><text x="1220" y="343" text-anchor="middle">CND</text></g><rect x="250" y="440" width="1030" height="100" class="box"/><text x="765" y="495" text-anchor="middle" class="s">设备 d：［边界条件 B(d) + 操作量 U(d)］ → 状态监测模型 fθ(d) → ［内部状态 + 出口/接口状态 Y(d)］</text><line x1="800" y1="365" x2="800" y2="440" class="thin" marker-end="url(#arrow)"/><rect x="1310" y="280" width="235" height="205" class="box"/><text x="1428" y="310" text-anchor="middle" class="xs">VHP代表性示例</text><text x="1428" y="336" text-anchor="middle" class="xs">16个输入变量 ↓ GRU状态监测模型</text><text x="1428" y="366" text-anchor="middle" class="xs">27候选输出</text><text x="1428" y="396" text-anchor="middle" class="xs">↓</text><text x="1428" y="426" text-anchor="middle" class="xs">24个最终评价点</text><line x1="1280" y1="490" x2="1310" y2="385" class="thin" marker-end="url(#arrow)"/><rect x="440" y="610" width="720" height="55" class="box"/><text x="800" y="642" text-anchor="middle" class="s">健康状态参考：用于后续故障诊断中状态偏差信息的构造</text><line x1="800" y1="540" x2="800" y2="610" class="thin" marker-end="url(#arrow)"/></svg>