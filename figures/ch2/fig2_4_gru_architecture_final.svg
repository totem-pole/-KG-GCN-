="thin" marker-end="url(#arrow)"/><line x1="1510" y1="276" x2="1550" y2="276" class="thin" marker-end="url(#arrow)"/><text x="85" y="430" class="l">单个GRU单元的信息更新机制</text><g class="s"><rect x="100" y="525" width="110" height="55" class="box"/><text x="155" y="558" text-anchor="middle">x(t)</text><rect x="100" y="640" width="110" height="55" class="box"/><text x="155" y="673" text-anchor="middle">h(t-1)</text><rect x="310" y="500" width="140" height="55" class="box"/><text x="380" y="533" text-anchor="middle">重置门 r(t)</text><rect x="310" y="625" width="140" height="55" class="box"/><text x="380" y="658" text-anchor="middle">更新门 z(t)</text><rect x="565" y="555" width="175" height="62" class="box"/><text x="653" y="592" text-anchor="middle">候选状态 h~(t)</text><rect x="830" y="555" width="150" height="62" class="box"/><text x="905" y="592" text-anchor="middle">当前状态 h(t)</text></g><line x1="210" y1="552" x2="310" y2="525" class="thin" marker-end="url(#arrow)"/><line x1="210" y1="667" x2="310" y2="652" class="thin" marker-end="url(#arrow)"/><line x1="210" y1="667" x2="565" y2="590" class="thin" marker-end="url(#arrow)"/><line x1="450" y1="527" x2="565" y2="578" class="thin" marker-end="url(#arrow)"/><line x1="450" y1="652" x2="830" y2="590" class="thin" marker-end="url(#arrow)"/><line x1="740" y1="586" x2="830" y2="586" class="thin" marker-end="url(#arrow)"/><text x="1110" y="560" class="s">真实网络结构：</text><text x="1110" y="595" class="s">24×16 → 单层GRU(32) → LayerNorm → Dropout(0.05) → Linear(27)</text><text x="1110" y="635" class="s">总参数量：5755；24个时间步共享同一组GRU参数。</text><text x="1110" y="675" class="s">24点为预测完成后的评价/诊断节点口径，并非Linear(24)。</text></svg>